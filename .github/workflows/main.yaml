name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site root (public)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- Project A: lumis (private) ---
      - name: Checkout lumis
        uses: actions/checkout@v4
        with:
          repository: zenebyte/lumis
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: src/lumis

      - name: Build lumis docs
        run: |
          cd src/lumis/docs
          yarn
          yarn build

      - name: Collect lumis into site
        run: |
          mkdir -p _site/lumis
          cp -r src/lumis/docs/dist/. _site/lumis/

      # --- Project B: unocss-presets (private) ---
      - name: Checkout unocss-presets
        uses: actions/checkout@v4
        with:
          repository: zenebyte/unocss-presets
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: src/unocss-presets

      - name: Build unocss-presets docs
        run: |
          cd src/unocss-presets/docs
          yarn
          yarn build

      - name: Collect unocss-presets into site
        run: |
          mkdir -p _site/unocss-presets
          cp -r src/unocss-presets/docs/dist/. _site/unocss-presets/

      

      # --- Project C: keel (private) ---
      - name: Checkout Keel
        uses: actions/checkout@v4
        with:
          repository: zenebyte/keel
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: src/keel

      - name: Build keel docs
        run: |
          cd src/keel/docs
          yarn
          yarn build

      - name: Collect keel into site
        run: |
          mkdir -p _site/keel
          cp -r src/keel/docs/dist/. _site/keel/    
      

      # --- Project D: Loom (private) ---
      - name: Checkout Loom
        uses: actions/checkout@v4
        with:
          repository: zenebyte/loom
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: src/loom

      - name: Build loom docs
        run: |
          cd src/loom/docs
          yarn
          yarn build

      - name: Collect loom into site
        run: |
          mkdir -p _site/loom
          cp -r src/loom/docs/dist/. _site/loom/ 

      # Root site content (README, landing page, etc.) — excludes build dirs and metadata
      - name: Collect root content into site
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='src' --exclude='_site' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
